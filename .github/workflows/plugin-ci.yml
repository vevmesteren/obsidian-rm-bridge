name: Plugin CI

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/plugin-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/plugin-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      # Phase 5c AC-6: SHA-pinned actions (floating @v4 refs replaced with
      # immutable commit SHAs). Update the SHA and the comment together.
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        # actions/setup-node@v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Ban unsafe process invocation
        run: |
          set -e
          echo "Checking plugin/src/ for banned patterns…"
          ! grep -rnE 'exec\(|execSync\(|shell:\s*true|bash\s+-c|cmd\.exe\s*/c' src/ \
            || { echo "::error::Banned process-invocation pattern found in plugin/src/"; exit 1; }
          echo "No banned patterns found."

      - name: Verify manifest isDesktopOnly
        run: |
          set -e
          node -e "const m=require('./manifest.json'); if(m.isDesktopOnly!==true){console.error('manifest.json must have isDesktopOnly: true'); process.exit(1)} console.log('manifest isDesktopOnly: true ✓')"

      - name: Verify build artifact
        run: |
          set -e
          test -f main.js && echo "main.js produced ✓"
