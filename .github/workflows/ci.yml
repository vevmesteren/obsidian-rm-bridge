name: CI

on:
  push:
    branches: [main, feat/v0.1.0-cli]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      # Phase 5c AC-6: SHA-pinned actions (floating @v4/@v5 refs replaced with
      # immutable commit SHAs). Update the SHA and the comment together.
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python@v5.3.0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Create venv and install (editable, with dev deps)
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install -e .[dev]
      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check .
      - name: Install Playwright Chromium
        run: |
          . .venv/bin/activate
          playwright install chromium
          playwright install-deps chromium
      - name: Tests (pytest)
        run: |
          . .venv/bin/activate
          pytest tests/ -q
      - name: Smoke — ormb --help
        run: |
          . .venv/bin/activate
          ormb --help
          ormb config show
